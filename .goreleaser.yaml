version: 2

project_name: cloudctx

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

brews:
  - name: cloudctx
    repository:
      owner: devops-chris
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/devops-chris/cloudctx"
    description: "A unified CLI for switching between cloud contexts"
    license: "MIT"
    # Skip Homebrew for pre-releases (alpha, beta, rc)
    skip_upload: auto
    install: |
      bin.install "cloudctx"
      bin.install_symlink "cloudctx" => "ctx"
    test: |
      system "#{bin}/cloudctx", "version"
    caveats: |
      cloudctx works out of the box - no shell setup required.

      Optional: to make your shell prompt (Starship, powerlevel10k, etc.)
      show the active AWS profile, add the shell integration so AWS_PROFILE
      follows the profile you switch to:

        # zsh - add to ~/.zshrc
        eval "$(ctx shell-init zsh)"

        # bash - add to ~/.bashrc
        eval "$(ctx shell-init bash)"

      Then open a new shell. This is only needed for prompt display; all
      other functionality works without it.

